<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FART BLASTER</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 4px solid #333;
      max-width: 100%;
      max-height: 100vh;
      max-height: 100dvh;
      background: #1a1a2e;
    }
    #ui {
      position: absolute;
      top: auto;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 8px 14px;
      border: 2px solid #087c18;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.78);
      text-align: center;
      color: #0f0;
      font-size: clamp(14px, 4vw, 18px);
      white-space: nowrap;
      text-shadow: 2px 2px #000;
      pointer-events: none;
      z-index: 10;
    }
    #milestoneMessage {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 10px 14px;
      border: 2px solid #ff6ec7;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.84);
      color: #ff9acb;
      font-size: clamp(15px, 4vw, 20px);
      font-weight: bold;
      text-align: center;
      text-shadow: 2px 2px #4a1732;
      pointer-events: none;
      z-index: 15;
    }
    #startScreen, #gameOver {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.85);
      color: #0f0;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #0f0;
      text-shadow: 0 0 10px #0f0;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 20px;
      background: #0a0;
      color: #000;
      border: 3px solid #0f0;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    .btn:active { background: #0f0; }
    p { margin: 8px 0; color: #8f8; }
    .hero-tag {
      margin-top: -6px;
      margin-bottom: 8px;
      color: #ff6ec7;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff6ec7, 3px 3px 0 #000;
      animation: flicker 0.25s infinite alternate;
    }
    .ending-message {
      color: #ff9acb;
      font-size: clamp(18px, 4vw, 28px);
      font-weight: bold;
      margin: 8px 0 6px;
      text-shadow: 2px 2px #4a1732;
    }
    .ending-line {
      color: #ffd1e8;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: bold;
      margin: 4px 0 8px;
      text-shadow: 2px 2px #000;
    }
    .kiss-scene {
      width: min(220px, 70vw);
      height: auto;
      image-rendering: pixelated;
      margin: 4px 0 6px;
    }
    @keyframes flicker {
      0% { opacity: 0.7; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1px); }
      100% { opacity: 0.9; transform: translateY(1px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-tag { animation: none; }
    }
  </style>
</head>
<body>
  <div id="ui">SCORE: 0</div>
  <div id="milestoneMessage" role="status" aria-live="polite" hidden></div>

  <div id="startScreen">
    <h1>💨 FART BLASTER</h1>
    <p class="hero-tag">Marcus saves the day</p>
    <p>8-BIT EDITION</p>
    <p>Creatures are coming!<br>Tap screen or press SPACE to FART BLAST</p>
    <p style="font-size:14px;margin-top:15px">Green gas destroys enemies</p>
    <button class="btn" id="startBtn">START GAME</button>
  </div>

  <div id="gameOver" style="display:none">
    <h1>GAME OVER</h1>
    <p id="finalScore">Score: 0</p>
    <p class="ending-message">Ashley loves farty macus</p>
    <svg class="kiss-scene" viewBox="0 0 180 110" role="img" aria-label="8-bit girl blowing a kiss to Marcus">
      <rect x="26" y="18" width="36" height="8" fill="#e74c3c"/>
      <rect x="22" y="24" width="12" height="8" fill="#e74c3c"/>
      <rect x="30" y="26" width="28" height="24" fill="#f5c6a5"/>
      <rect x="34" y="34" width="4" height="4" fill="#111"/>
      <rect x="48" y="34" width="4" height="4" fill="#111"/>
      <rect x="56" y="40" width="8" height="4" fill="#f5c6a5"/>
      <rect x="32" y="50" width="24" height="26" fill="#4a90d9"/>
      <rect x="34" y="76" width="8" height="12" fill="#2c3e50"/>
      <rect x="48" y="76" width="8" height="12" fill="#2c3e50"/>
      <rect x="90" y="18" width="30" height="10" fill="#ff66b3"/>
      <rect x="82" y="26" width="10" height="18" fill="#ff66b3"/>
      <rect x="92" y="26" width="26" height="22" fill="#f6d7b9"/>
      <rect x="96" y="22" width="22" height="8" fill="#ff66b3"/>
      <rect x="104" y="34" width="4" height="4" fill="#111"/>
      <rect x="112" y="34" width="4" height="4" fill="#111"/>
      <rect x="100" y="48" width="24" height="26" fill="#f9b5d0"/>
      <rect x="96" y="54" width="8" height="14" fill="#f6d7b9"/>
      <rect x="108" y="54" width="8" height="14" fill="#f6d7b9"/>
      <rect x="118" y="20" width="7" height="7" fill="#ff66b3"/>
      <rect x="126" y="28" width="7" height="7" fill="#ff66b3"/>
      <rect x="120" y="34" width="7" height="7" fill="#ff66b3"/>
      <rect x="128" y="40" width="7" height="7" fill="#ff66b3"/>
      <rect x="124" y="48" width="7" height="7" fill="#ff66b3"/>
      <rect x="135" y="30" width="7" height="7" fill="#ff66b3"/>
      <rect x="141" y="36" width="7" height="7" fill="#ff66b3"/>
      <rect x="66" y="50" width="7" height="7" fill="#ff66b3"/>
      <rect x="70" y="56" width="7" height="7" fill="#ff66b3"/>
      <rect x="62" y="58" width="7" height="7" fill="#ff66b3"/>
    </svg>
    <p class="ending-line">you saved me</p>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>

  <canvas id="game" width="360" height="640"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const uiEl = document.getElementById('ui');
    const milestoneMessageEl = document.getElementById('milestoneMessage');
    const startScreenEl = document.getElementById('startScreen');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');

    const W = 360;
    const H = 640;

    let score = 0;
    let lives = 3;
    let gameRunning = false;
    let enemies = [];
    let farts = [];
    let particles = [];
    let spawnTimer = 0;
    let spawnRate = 54;
    let frame = 0;
    let nextMilestoneIndex = 0;
    let milestoneTimeout;

    const scoreMilestones = [
      { score: 100, message: 'hell yeah brother' },
      { score: 200, message: "I'm the fart king" },
      { score: 300, message: 'farting hero' },
      { score: 400, message: 'I knew my farts would save the day' },
      { score: 500, message: "I don't trust this fart" }
    ];

    const player = {
      x: W / 2,
      y: H - 80,
      w: 24,
      h: 32,
      cooldown: 0
    };

    let audioCtx;
    function initAudio() {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function ensureAudio() {
      const ctxAudio = initAudio();
      if (!ctxAudio) return;
      if (ctxAudio.state === 'suspended') {
        ctxAudio.resume().catch(() => {});
      }
    }

    function playNote(freq, type, vol, dur) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.start(now);
      osc.stop(now + dur);
    }

    function playFart() {
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const duration = 0.45 + Math.random() * 0.25;
      const noiseSize = Math.floor(audioCtx.sampleRate * duration);
      const noiseBuffer = audioCtx.createBuffer(1, noiseSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);

      for (let i = 0; i < noiseSize; i++) {
        const wobble = 1 + Math.sin(i / 220) * 0.9;
        const envelope = Math.exp(-i / (noiseSize * 0.25));
        data[i] = (Math.random() * 2 - 1) * wobble * envelope;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(700 + Math.random() * 400, now);
      filter.Q.value = 0.5;

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.0001, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.18 + Math.random() * 0.12, now + 0.02);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      const rumble = audioCtx.createOscillator();
      const rumbleGain = audioCtx.createGain();
      rumble.type = 'sawtooth';
      rumble.frequency.setValueAtTime(35 + Math.random() * 25, now);
      rumble.frequency.exponentialRampToValueAtTime(18 + Math.random() * 8, now + duration);
      rumbleGain.gain.setValueAtTime(0.0001, now);
      rumbleGain.gain.exponentialRampToValueAtTime(0.08, now + 0.03);
      rumbleGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      rumble.connect(rumbleGain);
      rumbleGain.connect(audioCtx.destination);

      noise.start(now);
      noise.stop(now + duration + 0.05);
      rumble.start(now);
      rumble.stop(now + duration + 0.05);
    }

    function playHit() {
      playNote(220, 'square', 0.15, 0.08);
      playNote(110, 'square', 0.1, 0.12);
    }

    function playMusicNote(freq, dur) {
      playNote(freq, 'square', 0.06, dur);
    }

    const melody = [
      262, 294, 330, 262, 330, 349, 392, 0,
      392, 349, 330, 294, 262, 294, 330, 0,
      330, 349, 392, 440, 392, 349, 330, 0,
      294, 330, 262, 220, 262, 0, 0, 0
    ];
    let musicIndex = 0;
    let musicTimer = 0;

    function updateMusic() {
      if (!gameRunning) return;
      musicTimer++;
      if (musicTimer >= 12) {
        musicTimer = 0;
        const note = melody[musicIndex];
        if (note > 0) playMusicNote(note, 0.18);
        musicIndex = (musicIndex + 1) % melody.length;
      }
    }

    function showNextScoreMilestone() {
      while (nextMilestoneIndex < scoreMilestones.length && score >= scoreMilestones[nextMilestoneIndex].score) {
        const milestone = scoreMilestones[nextMilestoneIndex++];
        milestoneMessageEl.textContent = milestone.message;
        milestoneMessageEl.hidden = false;
        clearTimeout(milestoneTimeout);
        milestoneTimeout = setTimeout(() => {
          milestoneMessageEl.hidden = true;
        }, 2500);
      }
    }

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function drawPlayer() {
      const px = Math.floor(player.x - player.w / 2);
      const py = Math.floor(player.y - player.h / 2);

      drawPixelRect(px + 6, py + 10, 12, 14, '#4a90d9');
      drawPixelRect(px + 6, py, 12, 10, '#f5c6a5');
      drawPixelRect(px + 8, py + 3, 2, 2, '#000');
      drawPixelRect(px + 14, py + 3, 2, 2, '#000');
      drawPixelRect(px + 6, py + 22, 5, 8, '#2c3e50');
      drawPixelRect(px + 13, py + 22, 5, 8, '#2c3e50');
      drawPixelRect(px + 1, py + 12, 5, 4, '#f5c6a5');
      drawPixelRect(px + 18, py + 12, 5, 4, '#f5c6a5');
      drawPixelRect(px + 5, py - 2, 14, 4, '#e74c3c');
      drawPixelRect(px + 4, py + 1, 3, 3, '#e74c3c');
    }

    function drawEnemy(e) {
      const x = Math.floor(e.x - 12);
      const y = Math.floor(e.y - 12);
      drawPixelRect(x + 2, y + 4, 20, 16, e.color);
      drawPixelRect(x + 5, y + 7, 4, 4, '#fff');
      drawPixelRect(x + 13, y + 7, 4, 4, '#fff');
      drawPixelRect(x + 6, y + 8, 2, 2, '#f00');
      drawPixelRect(x + 14, y + 8, 2, 2, '#f00');
      drawPixelRect(x + 7, y + 14, 8, 2, '#000');
      drawPixelRect(x, y + 8, 3, 6, e.color);
      drawPixelRect(x + 21, y + 8, 3, 6, e.color);
      drawPixelRect(x + 6, y + 18, 3, 5, e.color);
      drawPixelRect(x + 15, y + 18, 3, 5, e.color);
    }

    function drawFart(f) {
      ctx.globalAlpha = f.life / 30;
      for (let i = 0; i < 6; i++) {
        const ox = Math.sin(frame * 0.2 + i) * 6;
        const oy = Math.cos(frame * 0.15 + i) * 4;
        drawPixelRect(f.x - 10 + ox + i * 3, f.y - 8 + oy, 10, 10, '#2ecc71');
        drawPixelRect(f.x - 6 + ox + i * 2, f.y - 4 + oy, 8, 8, '#27ae60');
      }
      drawPixelRect(f.x - 4, f.y - 4, 8, 8, '#1abc9c');
      ctx.globalAlpha = 1;
    }

    function drawParticle(p) {
      ctx.globalAlpha = p.life / 20;
      drawPixelRect(p.x, p.y, p.size, p.size, p.color);
      ctx.globalAlpha = 1;
    }

    function spawnEnemy() {
      const side = Math.random() < 0.5 ? 'top' : (Math.random() < 0.5 ? 'left' : 'right');
      let x, y, vx, vy;
      const speed = 2 + Math.random() * 1.8 + Math.min(score * 0.015, 2.5);

      if (side === 'top') {
        x = 30 + Math.random() * (W - 60);
        y = -20;
        vx = (player.x - x) * 0.01;
        vy = speed;
      } else if (side === 'left') {
        x = -20;
        y = 50 + Math.random() * (H * 0.6);
        vx = speed;
        vy = (player.y - y) * 0.008;
      } else {
        x = W + 20;
        y = 50 + Math.random() * (H * 0.6);
        vx = -speed;
        vy = (player.y - y) * 0.008;
      }

      const colors = ['#e74c3c', '#9b59b6', '#e67e22', '#c0392b', '#8e44ad', '#16a085', '#d35400', '#f1c40f'];
      enemies.push({
        x, y, vx, vy,
        color: colors[Math.floor(Math.random() * colors.length)],
        hp: 1
      });
    }

    function fireFart() {
      if (!gameRunning || player.cooldown > 0) return;
      player.cooldown = 18;
      playFart();

      farts.push({ x: player.x, y: player.y - 20, vx: 0, vy: -6, life: 35, radius: 28 });
      farts.push({ x: player.x - 8, y: player.y - 15, vx: -2.5, vy: -4.5, life: 28, radius: 20 });
      farts.push({ x: player.x + 8, y: player.y - 15, vx: 2.5, vy: -4.5, life: 28, radius: 20 });
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 15 + Math.random() * 10,
          size: 2 + Math.random() * 3,
          color: Math.random() > 0.5 ? '#2ecc71' : '#27ae60'
        });
      }
    }

    function update() {
      if (!gameRunning) return;
      frame++;

      if (player.cooldown > 0) player.cooldown--;

      spawnTimer++;
      if (spawnTimer >= spawnRate) {
        spawnTimer = 0;
        spawnEnemy();
        const extraChance = Math.min(0.1 + score / 250, 0.65);
        if (Math.random() < extraChance) spawnEnemy();
        if (spawnRate > 24) spawnRate = Math.max(24, spawnRate - 0.6);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;

        const dx = e.x - player.x;
        const dy = e.y - player.y;
        if (Math.sqrt(dx * dx + dy * dy) < 22) {
          enemies.splice(i, 1);
          lives--;
          playHit();
          createExplosion(player.x, player.y);
          if (lives <= 0) {
            endGame();
          }
          continue;
        }

        if (e.y > H + 40 || e.x < -40 || e.x > W + 40) {
          enemies.splice(i, 1);
        }
      }

      for (let i = farts.length - 1; i >= 0; i--) {
        const f = farts[i];
        f.x += f.vx;
        f.y += f.vy;
        f.life--;
        f.radius += 0.3;

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          const dx = e.x - f.x;
          const dy = e.y - f.y;
          if (Math.sqrt(dx * dx + dy * dy) < f.radius) {
            createExplosion(e.x, e.y);
            enemies.splice(j, 1);
            score += 10;
            showNextScoreMilestone();
            playHit();
          }
        }

        if (f.life <= 0) farts.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      updateMusic();
      uiEl.textContent = `SCORE: ${score}   LIVES: ${'❤'.repeat(lives)}`;
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#fff';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97) % W;
        const sy = (i * 53 + frame * 0.3) % H;
        ctx.fillRect(sx, sy, 2, 2);
      }

      drawPixelRect(0, H - 40, W, 40, '#16213e');
      for (let i = 0; i < W; i += 16) {
        drawPixelRect(i, H - 40, 8, 4, '#0f3460');
      }

      farts.forEach(drawFart);
      enemies.forEach(drawEnemy);
      particles.forEach(drawParticle);
      drawPlayer();

      if (player.cooldown > 0) {
        ctx.fillStyle = '#333';
        ctx.fillRect(player.x - 15, player.y + 22, 30, 4);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(player.x - 15, player.y + 22, 30 * (1 - player.cooldown / 18), 4);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function handleInput(e) {
      if (e) e.preventDefault();
      if (!gameRunning) return;
      ensureAudio();
      fireFart();
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        handleInput(e);
      }
    });

    canvas.addEventListener('pointerdown', handleInput);
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    function startGame() {
      ensureAudio();

      score = 0;
      lives = 3;
      enemies = [];
      farts = [];
      particles = [];
      spawnTimer = 0;
      spawnRate = 54;
      player.cooldown = 0;
      musicIndex = 0;
      musicTimer = 0;
      nextMilestoneIndex = 0;
      clearTimeout(milestoneTimeout);
      milestoneMessageEl.hidden = true;
      gameRunning = true;

      startScreenEl.style.display = 'none';
      gameOverEl.style.display = 'none';
      uiEl.style.display = 'block';
      uiEl.textContent = `SCORE: ${score}   LIVES: ${'❤'.repeat(lives)}`;
    }

    function endGame() {
      gameRunning = false;
      finalScoreEl.textContent = `Final Score: ${score}`;
      gameOverEl.style.display = 'flex';
    }

    uiEl.style.display = 'block';
    startScreenEl.style.display = 'flex';
    gameOverEl.style.display = 'none';
    loop();
  </script>
</body>
</html>
